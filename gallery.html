<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flourish Gallery</title>
    <link rel="stylesheet" href="css/Main.css">
    <link rel="stylesheet" href="css/gallery.css">
    <script src="js/instance.js"></script>
</head>
<body>
    <div class="wrapper">

        <header>
            <header>
            <!-- logo etc. -->
            <a id="logoLink" href="index.html"><img id="logo" src="images/indexImgs/IMG_2804.PNG" alt="Flourish Logo"></a>
        </header>
        </header>
        <main>
            <!-- Guest Gallery -->
            <div id="guestGallery" class="gallery">
                <!-- slide 1 -->
                <div class="gallerySlide firstSlide">
                    <img src="images/galleryImgs/guestGallery/IdaSasoria.jpg" alt="IdaSasoria">
                    <div class="text">Artist: IdaSasoria</div>
                    <div class="socials">
                        <!-- links to artist socials -->
                    </div>
                </div>

                <!-- slide 2 -->
                <div class="gallerySlide">
                    <img src="images/galleryImgs/guestGallery/IMG_5309.png" alt="#">
                    <div class="text">Artist: </div>
                    <div class="socials">
                        <!-- links to artist socials -->
                    </div>
                </div>

                <!-- slide 3 -->
                <div class="gallerySlide">
                    <img src="images/galleryImgs/guestGallery/pawsiefi.png" alt="pawsiefi">
                    <div class="text">Artist: pawsiefi</div>
                    <div class="socials">
                        <!-- links to artist socials -->
                    </div>
                </div>

                <!-- slide 4 -->
                <div class="gallerySlide">
                    <img src="images/galleryImgs/guestGallery/PYOudent.png" alt="PYOudent">
                    <div class="text">Artist: PYOudent</div>
                    <div class="socials">
                        <!-- links to artist socials -->
                    </div>
                </div>

                <!-- slide 5 -->
                <div class="gallerySlide">
                    <img src="images/galleryImgs/guestGallery/Rook Comm V2.png" alt="MayorHam">
                    <div class="text">Artist: MayorHam</div>
                    <div class="socials">
                        <!-- links to artist socials -->
                    </div>
                </div>

                <!-- slide 6 -->
                <div class="gallerySlide">
                    <img src="images/galleryImgs/guestGallery/rook.png" alt="uhhhh">
                    <div class="text">Artist: </div>
                    <div class="socials">
                        <!-- links to artist socials -->
                    </div>
                </div>

                <!-- slide 7 -->
                <div class="gallerySlide">
                    <img src="images/galleryImgs/guestGallery/seibaaart.png" alt="Seibaaart">
                    <div class="text">Artist: Seibaaart</div>
                    <div class="socials">
                        <!-- links to artist socials -->
                    </div>
                </div>

                <!-- slide 8 -->
                <div class="gallerySlide">
                    <img src="images/galleryImgs/guestGallery/shootingstarrfish.png" alt="Shootingstarrfish">
                    <div class="text">Artist: Shootingstarrfish</div>
                    <div class="socials">
                        <!-- links to artist socials -->
                    </div>
                </div>

                <!-- slide 9 -->
                <div class="gallerySlide">
                    <img src="images/galleryImgs/guestGallery/snoweardraws.png" alt="Snoweardraws">
                    <div class="text">Artist: Snoweardraws</div>
                    <div class="socials">
                        <!-- links to artist socials -->
                    </div>
                </div>

                <!-- slide 10 -->
                <div class="gallerySlide">
                    <img src="images/galleryImgs/guestGallery/Titelloses_5_20260306233046.png" alt="uhhhhh">
                    <div class="text">Artist: </div>
                    <div class="socials">
                        <!-- links to artist socials -->
                    </div>
                </div>

                <a class="prev" onclick="changeSlide(this, -1)">&#10094;</a>
                <a class="next" onclick="changeSlide(this, 1)">&#10095;</a>

                <div class="dot-container">
                    <!-- there needs to be one dot for every image in the gallery -->
                    <span class="dot" onclick="currentSlide(1)"></span>
                    <span class="dot" onclick="currentSlide(2)"></span>
                    <span class="dot" onclick="currentSlide(3)"></span>
                    <span class="dot" onclick="currentSlide(4)"></span>
                    <span class="dot" onclick="currentSlide(5)"></span>
                    <span class="dot" onclick="currentSlide(6)"></span>
                    <span class="dot" onclick="currentSlide(7)"></span>
                    <span class="dot" onclick="currentSlide(8)"></span>
                    <span class="dot" onclick="currentSlide(9)"></span>
                    <span class="dot" onclick="currentSlide(10)"></span>
                </div>
            </div>

            <div id="officialGallery" class="gallery">

                <div class="gallerySlide">
                    <img src="images/galleryImgs/officialGallery/Allium.png" alt="uhhhhh">
                    <div class="text">Artist: RookRow </div>
                    <div class="socials">
                        <!-- links to artist socials -->
                    </div>
                </div>

                <div class="gallerySlide">
                    <img src="images/galleryImgs/officialGallery/AlliumHangedMan.png" alt="uhhhhh">
                    <div class="text">Artist: RookRow </div>
                    <div class="socials">
                        <!-- links to artist socials -->
                    </div>
                </div>

                <!-- button controls -->
                <a class="prev" onclick="changeSlide(this, -1)">&#10094;</a>
                <a class="next" onclick="changeSlide(this, 1)">&#10095;</a>

            <div id="conceptGallery" class="gallery">

        startTimer();
